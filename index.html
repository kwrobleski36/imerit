<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Competition Hub</title>
  <link rel="stylesheet" href="https://unpkg.com/98.css">
  
  <style>
    body {
      background-color: #121212;
      color: #dfdfdf;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .window {
      background: #2b2b2b;
      box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #4d4d4d, inset -2px -2px #1e1e1e, inset 2px 2px #3d3d3d;
    }
    .title-bar {
      background: linear-gradient(90deg, #000080, #1084d0);
    }
    button {
      background: #2b2b2b;
      color: #dfdfdf;
      box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #4d4d4d, inset -2px -2px #1e1e1e, inset 2px 2px #3d3d3d;
      cursor: pointer;
    }
    button:active {
      box-shadow: inset -1px -1px #4d4d4d, inset 1px 1px #0a0a0a, inset -2px -2px #3d3d3d, inset 2px 2px #1e1e1e;
    }
    input[type="password"], input[type="date"] {
      background: #1e1e1e;
      color: #dfdfdf;
      border: none;
      box-shadow: inset -1px -1px #4d4d4d, inset 1px 1px #0a0a0a, inset -2px -2px #3d3d3d, inset 2px 2px #1e1e1e;
      padding: 4px;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }
    #hub-section {
      display: none;
    }
    .sunken-panel {
      background: #1e1e1e;
      box-shadow: inset -1px -1px #4d4d4d, inset 1px 1px #0a0a0a, inset -2px -2px #3d3d3d, inset 2px 2px #1e1e1e;
      padding: 10px;
      margin-top: 15px;
      height: 250px;
      overflow-y: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 4px 8px;
      border-bottom: 1px solid #3d3d3d;
    }
    th {
      background-color: #2b2b2b;
    }
    tbody {
      background-color: #ffffff;
      color: #000000;
    }
    tbody td a {
      color: #000000 !important;
      text-decoration: none;
    }
    tbody td a:hover {
      text-decoration: underline;
    }
    .controls-row {
      display: flex;
      gap: 15px;
      align-items: flex-end;
      margin-bottom: 10px;
    }
    .flex-space {
      flex-grow: 1;
    }
  </style>
</head>
<body>

  <div class="window" id="login-section" style="width: 300px;">
    <div class="title-bar">
      <div class="title-bar-text">Competition Hub - System Login</div>
    </div>
    <div class="window-body">
      <div class="field-row-stacked">
        <label for="password">Authentication Key:</label>
        <input id="password" type="password" style="width: 100%; margin-top: 5px;">
      </div>
      <div style="text-align: right; margin-top: 15px;">
        <button id="login-btn">Enter</button>
      </div>
      <p id="error-msg" style="color: #ff5555; display: none; margin-top: 10px; text-align: center;">Access Denied.</p>
    </div>
  </div>

  <div class="window" id="hub-section" style="width: 600px;">
    <div class="title-bar">
      <div class="title-bar-text">Competition Hub - Dashboard</div>
    </div>
    <div class="window-body">
      
      <div class="controls-row">
        <div class="field-row-stacked">
          <label for="start-date">Start Date (TCT):</label>
          <input id="start-date" type="date">
        </div>
        <div class="field-row-stacked">
          <label for="end-date">End Date (TCT):</label>
          <input id="end-date" type="date">
        </div>
        <button id="fetch-btn">Pull Standings</button>
        <div class="flex-space"></div>
        <button id="discord-btn" style="display: none;">Post to Discord</button>
      </div>

      <hr>

      <div id="module-container">
        <p style="margin-bottom: 5px; font-weight: bold;">Blood Bag Fills</p>
        <div class="sunken-panel">
          <table>
            <thead>
              <tr>
                <th>Rank</th>
                <th>Member</th>
                <th>Fills</th>
              </tr>
            </thead>
            <tbody id="standings-body">
              <tr><td colspan="3" style="text-align: center; color: #888;">Select dates and pull data.</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    const WORKER_URL = 'https://comp-hub-backend.kwrobleski.workers.dev'; 
    let sessionPassword = '';
    let currentStandings = [];

    document.getElementById('login-btn').addEventListener('click', async () => {
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      
      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'login', password })
        });

        if (response.ok) {
          sessionPassword = password;
          document.getElementById('login-section').style.display = 'none';
          document.getElementById('hub-section').style.display = 'block';
        } else {
          errorMsg.style.display = 'block';
        }
      } catch (e) {
        errorMsg.innerText = "Network Error.";
        errorMsg.style.display = 'block';
      }
    });

    document.getElementById('fetch-btn').addEventListener('click', async () => {
      const startDate = document.getElementById('start-date').value;
      const endDate = document.getElementById('end-date').value;
      const standingsBody = document.getElementById('standings-body');
      const discordBtn = document.getElementById('discord-btn');

      if (!startDate || !endDate) {
        alert("Select Start and End dates.");
        return;
      }

      discordBtn.style.display = 'none';
      currentStandings = [];

      const startUnix = Math.floor(new Date(`${startDate}T00:00:00Z`).getTime() / 1000);
      const endUnix = Math.floor(new Date(`${endDate}T23:59:59Z`).getTime() / 1000);
      const currentUnix = Math.floor(Date.now() / 1000);

      standingsBody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #888;">Fetching member list...</td></tr>';

      try {
        const memberRes = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'get_members', password: sessionPassword })
        });
        
        const memberResult = await memberRes.json();
        if (!memberResult.success) {
          standingsBody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #ff5555;">Error: ${memberResult.error}</td></tr>`;
          return;
        }

        const members = Object.entries(memberResult.members);
        const total = members.length;
        const standings = [];

        for (let i = 0; i < total; i++) {
          const [id, member] = members[i];
          
          const memberJoinUnix = currentUnix - ((member.days_in_faction || 0) * 86400);
          
          if (memberJoinUnix > endUnix) {
            continue;
          }

          let adjustedStartUnix = startUnix;
          if (memberJoinUnix > startUnix) {
            adjustedStartUnix = memberJoinUnix;
          }

          standingsBody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #888;">Fetching stats: ${i + 1} / ${total} members...</td></tr>`;
          
          const statRes = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'get_user_stats', password: sessionPassword, startUnix: adjustedStartUnix, endUnix, userId: id })
          });
          const statResult = await statRes.json();
          
          if (statResult.success) {
            standings.push({ id, name: member.name, fills: statResult.fills });
          }

          await new Promise(r => setTimeout(r, 200));
        }

        standings.sort((a, b) => b.fills - a.fills);
        currentStandings = standings.filter(m => m.fills > 0);
        standingsBody.innerHTML = '';
        
        currentStandings.forEach((member, index) => {
          standingsBody.innerHTML += `
            <tr>
              <td>${index + 1}</td>
              <td><a href="https://www.torn.com/profiles.php?XID=${member.id}" target="_blank">${member.name}</a></td>
              <td>${member.fills}</td>
            </tr>
          `;
        });

        if (standingsBody.innerHTML === '') {
           standingsBody.innerHTML = '<tr><td colspan="3" style="text-align: center;">No activity found.</td></tr>';
        } else {
           discordBtn.style.display = 'block';
        }
      } catch (e) {
        standingsBody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #ff5555;">Network error.</td></tr>';
      }
    });

    document.getElementById('discord-btn').addEventListener('click', async () => {
      const startDate = document.getElementById('start-date').value;
      const endDate = document.getElementById('end-date').value;
      const discordBtn = document.getElementById('discord-btn');
      
      const originalText = discordBtn.innerText;
      discordBtn.innerText = 'Posting...';
      discordBtn.disabled = true;

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            action: 'post_discord', 
            password: sessionPassword, 
            standings: currentStandings,
            dateString: `${startDate} to ${endDate}`
          })
        });

        if (response.ok) {
          discordBtn.innerText = 'Posted!';
          setTimeout(() => {
            discordBtn.innerText = originalText;
            discordBtn.disabled = false;
          }, 3000);
        } else {
          discordBtn.innerText = 'Error';
          discordBtn.disabled = false;
        }
      } catch (e) {
        discordBtn.innerText = 'Error';
        discordBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
