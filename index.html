<!DOCTYPE html>
<html>
<head>
    <title>Blood Drive Master Dashboard</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            background: #1e1e1e; 
            color: #ffffff; 
        }
        .container { 
            max-width: 800px; 
            margin: auto; 
            background: #2d2d2d; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        input, button { 
            padding: 10px; 
            margin: 10px 0; 
            width: 100%; 
            box-sizing: border-box; 
            border-radius: 4px;
            border: 1px solid #555;
        }
        input { background: #111; color: #fff; }
        
        .date-time-row {
            display: flex;
            gap: 15px;
            margin: 10px 0;
        }
        .date-time-row div {
            flex: 1;
        }
        label {
            font-size: 14px;
            color: #aaa;
        }

        .primary-btn { 
            background: #e53935; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            border: none;
            margin-top: 20px;
        }
        .primary-btn:hover { background: #c62828; }
        
        .dashboard-section {
            margin-top: 30px;
            background: #111;
            padding: 15px;
            border-radius: 5px;
        }
        
        .table-container { 
            max-height: 400px; 
            overflow-y: auto; 
            margin-top: 10px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #333;
        }
        th {
            background-color: #222;
            position: sticky;
            top: 0;
            color: #e53935;
        }
        tr:nth-child(even) { background-color: #1a1a1a; }
        tr:hover { background-color: #2a2a2a; }
        
        .rank { font-weight: bold; color: #888; width: 40px; }
        h3 { margin-top: 0; color: #4CAF50; border-bottom: 1px solid #333; padding-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Blood Drive Master Dashboard</h2>
        
        <div id="loginScreen">
            <label>Enter your Torn API Key (Limited Access):</label>
            <input type="password" id="apiKeyInput" placeholder="Paste your API key here..." />
            
            <div class="date-time-row">
                <div>
                    <label>Competition Start Date:</label>
                    <input type="date" id="startDate" />
                </div>
                <div>
                    <label>Start Time (Your Local Time):</label>
                    <input type="time" id="startTime" />
                </div>
            </div>

            <button class="primary-btn" onclick="runDashboard()">Load Dashboard</button>
        </div>
        
        <div id="statusMessage" style="margin-top: 15px;"></div>

        <!-- Section 1: The Snapshot -->
        <div class="dashboard-section" id="snapshotSection" style="display: none;">
            <h3>1. Current Armory Snapshot</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Item Name</th>
                            <th>Quantity in Armory</th>
                        </tr>
                    </thead>
                    <tbody id="snapshotBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Section 2: The Leaderboard -->
        <div class="dashboard-section" id="leaderboardSection" style="display: none;">
            <h3 id="leaderboardTitle">2. Player Leaderboard (Bags Filled)</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th class="rank">#</th>
                            <th>Player Name</th>
                            <th>Filled Bags</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function runDashboard() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const statusDiv = document.getElementById('statusMessage');
            
            const startDateVal = document.getElementById('startDate').value;
            const startTimeVal = document.getElementById('startTime').value;
            
            if (!apiKey) {
                statusDiv.innerHTML = "<span style='color: #ff5555;'>Please enter an API key.</span>";
                return;
            }

            // Convert the user's selected date/time into a UNIX timestamp
            let startUnixTimestamp = 0;
            if (startDateVal) {
                // Default to midnight if they pick a date but no time
                const timeString = startTimeVal ? startTimeVal : '00:00'; 
                const dateObj = new Date(`${startDateVal}T${timeString}`);
                startUnixTimestamp = Math.floor(dateObj.getTime() / 1000);
            }

            statusDiv.innerHTML = "Fetching snapshot and logs from Torn...";
            
            document.getElementById('snapshotSection').style.display = "none";
            document.getElementById('leaderboardSection').style.display = "none";

            const medicalUrl = `https://api.torn.com/faction/?selections=medical&key=${apiKey}`;
            const newsUrl = `https://api.torn.com/faction/?selections=armorynews&key=${apiKey}`;
            
            try {
                const [medicalRes, newsRes] = await Promise.all([fetch(medicalUrl), fetch(newsUrl)]);
                const medicalData = await medicalRes.json();
                const newsData = await newsRes.json();
                
                if (medicalData.error || newsData.error) {
                    const errMsg = medicalData.error ? medicalData.error.error : newsData.error.error;
                    statusDiv.innerHTML = `<span style='color: #ff5555;'>API Error: ${errMsg}</span>`;
                    return;
                }

                statusDiv.innerHTML = "<span style='color: #4CAF50;'>Dashboard loaded successfully!</span>";

                // --- BUILD SNAPSHOT (Real-time, ignores date filter) ---
                const snapshotBody = document.getElementById('snapshotBody');
                snapshotBody.innerHTML = "";
                if (medicalData.medical) {
                    const bloodBags = Object.values(medicalData.medical).filter(item => item.name.includes("Blood Bag"));
                    bloodBags.sort((a, b) => a.name.localeCompare(b.name));
                    
                    bloodBags.forEach(item => {
                        snapshotBody.innerHTML += `
                            <tr>
                                <td style="color: #fff;">${item.name}</td>
                                <td style="color: #4CAF50; font-weight: bold;">${item.quantity.toLocaleString()}</td>
                            </tr>`;
                    });
                    document.getElementById('snapshotSection').style.display = "block";
                }

                // --- BUILD LEADERBOARD (Filtered by Date/Time) ---
                const leaderboardBody = document.getElementById('leaderboardBody');
                leaderboardBody.innerHTML = "";
                if (newsData.armorynews) {
                    const playerTotals = {};
                    let oldestLogTimestamp = Date.now() / 1000;
                    
                    Object.values(newsData.armorynews).forEach(log => {
                        // Track the oldest log we can see to warn the user
                        if (log.timestamp < oldestLogTimestamp) {
                            oldestLogTimestamp = log.timestamp;
                        }

                        // Apply the Date/Time filter
                        if (log.timestamp >= startUnixTimestamp) {
                            if (log.news.includes("filled") && log.news.includes("faction's Empty Blood Bag")) {
                                const nameMatch = log.news.match(/>([^<]+)<\/a>/);
                                const playerName = nameMatch ? nameMatch[1] : "Unknown Player";

                                let quantity = 1;
                                const qtyMatch = log.news.match(/filled (one|\d+[\d,]*) of/i);
                                if (qtyMatch) {
                                    quantity = qtyMatch[1].toLowerCase() === 'one' ? 1 : parseInt(qtyMatch[1].replace(/,/g, ''));
                                }

                                playerTotals[playerName] = (playerTotals[playerName] || 0) + quantity;
                            }
                        }
                    });

                    const leaderboard = Object.keys(playerTotals).map(name => ({ name, total: playerTotals[name] }));
                    leaderboard.sort((a, b) => b.total - a.total);

                    // Update Title to reflect the filter status
                    const titleEl = document.getElementById('leaderboardTitle');
                    if (startUnixTimestamp > 0) {
                        if (startUnixTimestamp < oldestLogTimestamp) {
                            titleEl.innerHTML = `2. Player Leaderboard <span style="color:#ff9800; font-size:14px;">(Warning: Torn logs only go back to ${new Date(oldestLogTimestamp * 1000).toLocaleDateString()}, some early data may be missing)</span>`;
                        } else {
                            titleEl.innerHTML = `2. Player Leaderboard <span style="color:#aaa; font-size:14px;">(Since ${new Date(startUnixTimestamp * 1000).toLocaleString()})</span>`;
                        }
                    } else {
                        titleEl.innerHTML = `2. Player Leaderboard <span style="color:#aaa; font-size:14px;">(All available history)</span>`;
                    }

                    if (leaderboard.length === 0) {
                        leaderboardBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#888;">No bags filled during this timeframe.</td></tr>`;
                    } else {
                        leaderboard.forEach((player, index) => {
                            leaderboardBody.innerHTML += `
                                <tr>
                                    <td class="rank">${index + 1}</td>
                                    <td style="color: #fff; font-weight: bold;">${player.name}</td>
                                    <td style="color: #e53935; font-weight: bold;">${player.total.toLocaleString()}</td>
                                </tr>`;
                        });
                    }
                    
                    document.getElementById('leaderboardSection').style.display = "block";
                }

            } catch (error) {
                statusDiv.innerHTML = `<span style='color: #ff5555;'>Connection error: ${error.message}</span>`;
            }
        }
    </script>
</body>
</html>
