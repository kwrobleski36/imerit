<!DOCTYPE html>
<html>
<head>
    <title>Blood Bag Tracker</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            background: #1e1e1e; 
            color: #ffffff; 
        }
        .container { 
            max-width: 600px; 
            margin: auto; 
            background: #2d2d2d; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        input, button { 
            padding: 10px; 
            margin: 10px 0; 
            width: 100%; 
            box-sizing: border-box; 
            border-radius: 4px;
            border: 1px solid #555;
        }
        input { background: #111; color: #fff; }
        button { 
            background: #4CAF50; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            border: none;
        }
        button:hover { background: #45a049; }
        #results { 
            margin-top: 20px; 
            background: #111; 
            padding: 15px; 
            border-radius: 5px; 
            height: 400px; 
            overflow-y: auto; 
        }
        .log-entry { 
            margin-bottom: 8px; 
            font-size: 14px; 
            border-bottom: 1px solid #444; 
            padding-bottom: 8px; 
        }
        .timestamp { color: #888; font-size: 12px; display: block; margin-bottom: 2px;}
    </style>
</head>
<body>
    <div class="container">
        <h2>Faction Blood Bag Tracker</h2>
        
        <!-- Login Screen -->
        <div id="loginScreen">
            <label>Enter your Torn API Key (Limited Access):</label>
            <input type="password" id="apiKeyInput" placeholder="Paste your API key here..." />
            <button onclick="fetchLogs()">Get Blood Bag Logs</button>
        </div>

        <!-- Results Screen -->
        <div id="results">Waiting for API key...</div>
    </div>

    <script>
        async function fetchLogs() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const resultsDiv = document.getElementById('results');
            
            if (!apiKey) {
                resultsDiv.innerHTML = "<span style='color: #ff5555;'>Please enter an API key.</span>";
                return;
            }

            resultsDiv.innerHTML = "Connecting to Torn API v2...";

            // CORRECTED: 'cat' is now 'armorynews' instead of 'armory'
            const url = `https://api.torn.com/v2/faction/news?cat=armorynews&key=${apiKey}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.error) {
                    resultsDiv.innerHTML = `<span style='color: #ff5555;'>API Error: ${data.error.error}</span>`;
                    return;
                }

                if (!data.news) {
                    resultsDiv.innerHTML = "<span style='color: #ff5555;'>No news data found. Ensure your API key has faction access permissions.</span>";
                    return;
                }

                // Filter specifically for Blood Bags
                const bloodBagLogs = data.news.filter(log => log.news.includes("Blood Bag"));

                if (bloodBagLogs.length === 0) {
                    resultsDiv.innerHTML = "No blood bag activity found in the recent armory logs.";
                    return;
                }

                // Print the filtered results to the screen
                resultsDiv.innerHTML = ""; 
                bloodBagLogs.forEach(log => {
                    const date = new Date(log.timestamp * 1000).toLocaleString();
                    resultsDiv.innerHTML += `
                        <div class="log-entry">
                            <span class="timestamp">${date}</span>
                            ${log.news}
                        </div>`;
                });

            } catch (error) {
                resultsDiv.innerHTML = `<span style='color: #ff5555;'>Connection error: ${error.message}</span>`;
            }
        }
    </script>
</body>
</html>
