<!DOCTYPE html>
<html>
<head>
    <title>Blood Bag Tracker</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            background: #1e1e1e; 
            color: #ffffff; 
        }
        .container { 
            max-width: 800px; 
            margin: auto; 
            background: #2d2d2d; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        input, button { 
            padding: 10px; 
            margin: 10px 0; 
            width: 100%; 
            box-sizing: border-box; 
            border-radius: 4px;
            border: 1px solid #555;
        }
        input { background: #111; color: #fff; }
        .primary-btn { 
            background: #4CAF50; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            border: none;
        }
        .primary-btn:hover { background: #45a049; }
        
        .csv-btn {
            background: #2196F3;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
            display: none; /* Hidden until data loads */
            margin-top: 0;
        }
        .csv-btn:hover { background: #1976D2; }

        .table-container { 
            margin-top: 20px; 
            background: #111; 
            border-radius: 5px; 
            max-height: 500px; /* Prevents screen flooding */
            overflow-y: auto; 
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #333;
        }
        th {
            background-color: #222;
            position: sticky;
            top: 0;
            color: #4CAF50;
        }
        tr:nth-child(even) { background-color: #1a1a1a; }
        tr:hover { background-color: #2a2a2a; }
        
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Faction Blood Bag Tracker</h2>
        
        <div id="loginScreen">
            <label>Enter your Torn API Key (Limited Access):</label>
            <input type="password" id="apiKeyInput" placeholder="Paste your API key here..." />
            <button class="primary-btn" onclick="fetchLogs()">Fetch Armory Logs</button>
        </div>

        <div class="controls">
            <div id="statusMessage"></div>
            <button id="csvButton" class="csv-btn" onclick="downloadCSV()">Download as CSV</button>
        </div>

        <div class="table-container">
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>Activity Log</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                    <!-- Data populates here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Store data globally so the CSV button can access it
        let globalBloodBagData = [];

        async function fetchLogs() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const statusDiv = document.getElementById('statusMessage');
            const resultsBody = document.getElementById('resultsBody');
            const csvBtn = document.getElementById('csvButton');
            
            if (!apiKey) {
                statusDiv.innerHTML = "<span style='color: #ff5555;'>Please enter an API key.</span>";
                return;
            }

            statusDiv.innerHTML = "Fetching data from Torn...";
            csvBtn.style.display = "none";
            resultsBody.innerHTML = "";
            globalBloodBagData = [];

            const url = `https://api.torn.com/v2/faction/news?cat=armorynews&key=${apiKey}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.error) {
                    statusDiv.innerHTML = `<span style='color: #ff5555;'>API Error: ${data.error.error}</span>`;
                    return;
                }

                if (!data.news) {
                    statusDiv.innerHTML = "<span style='color: #ff5555;'>No news data found.</span>";
                    return;
                }

                const bloodBagLogs = data.news.filter(log => log.news.includes("Blood Bag"));

                if (bloodBagLogs.length === 0) {
                    statusDiv.innerHTML = "No blood bag activity found in recent logs.";
                    return;
                }

                statusDiv.innerHTML = `<span style='color: #4CAF50;'>Found ${bloodBagLogs.length} blood bag records.</span>`;
                
                bloodBagLogs.forEach(log => {
                    const date = new Date(log.timestamp * 1000).toLocaleString();
                    
                    // Strip HTML tags (like profile links) from the news string for a cleaner spreadsheet
                    const cleanText = log.news.replace(/<[^>]*>?/gm, '');
                    
                    // Save for CSV
                    globalBloodBagData.push({ date: date, text: cleanText });

                    // Add to HTML table
                    resultsBody.innerHTML += `
                        <tr>
                            <td style="white-space: nowrap; color: #aaa;">${date}</td>
                            <td>${log.news}</td>
                        </tr>`;
                });

                // Show the CSV download button now that we have data
                csvBtn.style.display = "block";

            } catch (error) {
                statusDiv.innerHTML = `<span style='color: #ff5555;'>Connection error: ${error.message}</span>`;
            }
        }

        function downloadCSV() {
            if (globalBloodBagData.length === 0) return;

            // Create CSV headers
            let csvContent = "data:text/csv;charset=utf-8,Date,Activity\n";
            
            // Loop through data and format as CSV rows
            globalBloodBagData.forEach(row => {
                // Wrap text in quotes so commas in the text don't break the columns
                csvContent += `"${row.date}","${row.text}"\n`;
            });

            // Trigger the download
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "BloodBag_Logs.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
