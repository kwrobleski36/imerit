<!DOCTYPE html>
<html>
<head>
    <title>Faction Armory Dashboard</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            background: #1e1e1e; 
            color: #ffffff; 
        }
        .container { 
            max-width: 900px; 
            margin: auto; 
            background: #2d2d2d; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        input, button { 
            padding: 10px; 
            margin: 10px 0; 
            width: 100%; 
            box-sizing: border-box; 
            border-radius: 4px;
            border: 1px solid #555;
        }
        input { background: #111; color: #fff; }
        .primary-btn { 
            background: #e53935; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            border: none;
        }
        .primary-btn:hover { background: #c62828; }
        
        .csv-btn {
            background: #2196F3;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
            width: auto;
            padding: 8px 15px;
            margin: 0;
        }
        .csv-btn:hover { background: #1976D2; }

        .dashboard-section {
            margin-top: 30px;
            background: #111;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #e53935;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        
        h3 { margin: 0; color: #4CAF50; }

        .search-box {
            width: 100%;
            margin-bottom: 15px;
        }

        .table-container { 
            max-height: 500px; 
            overflow-y: auto; 
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #333;
        }
        th {
            background-color: #222;
            position: sticky;
            top: 0;
            color: #e53935;
            z-index: 10;
        }
        tr:nth-child(even) { background-color: #1a1a1a; }
        tr:hover { background-color: #2a2a2a; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Faction Armory Dashboard</h2>
        
        <div id="loginScreen">
            <label>Enter your Torn API Key (Limited Access):</label>
            <input type="password" id="apiKeyInput" placeholder="Paste your API key here..." />
            <button class="primary-btn" onclick="fetchDashboardData()">Load Dashboard</button>
        </div>
        
        <div id="statusMessage" style="margin-top: 15px;"></div>

        <!-- Section 1: Blood Bag Snapshot -->
        <div class="dashboard-section" id="snapshotSection" style="display: none;">
            <div class="section-header">
                <h3>1. Blood Bag Inventory Snapshot</h3>
                <button class="csv-btn" onclick="downloadSnapshotCSV()">Download Snapshot CSV</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Item Name</th>
                            <th>Quantity in Armory</th>
                        </tr>
                    </thead>
                    <tbody id="snapshotBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Section 2: Raw Armory Logs -->
        <div class="dashboard-section" id="logsSection" style="display: none;">
            <div class="section-header">
                <h3>2. Faction Armory Logs (300 Recent)</h3>
                <button class="csv-btn" onclick="downloadLogsCSV()">Download Filtered CSV</button>
            </div>
            <input type="text" id="searchInput" class="search-box" placeholder="Search logs (e.g., 'Blood Bag', 'PlayerName', 'Xanax')..." onkeyup="filterTable()">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 220px;">Date & Time (TCT)</th>
                            <th>Log Entry</th>
                        </tr>
                    </thead>
                    <tbody id="logsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let allLogs = [];
        let snapshotData = [];

        async function fetchDashboardData() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const statusDiv = document.getElementById('statusMessage');
            
            if (!apiKey) {
                statusDiv.innerHTML = "<span style='color: #ff5555;'>Please enter an API key.</span>";
                return;
            }

            statusDiv.innerHTML = "Fetching snapshot and paging through history for 300 logs...";
            document.getElementById('snapshotSection').style.display = "none";
            document.getElementById('logsSection').style.display = "none";
            
            allLogs = [];
            snapshotData = [];

            try {
                // --- 1. BUILD SNAPSHOT (Medical items) ---
                const medicalUrl = `https://api.torn.com/faction/?selections=medical&key=${apiKey}`;
                const medicalRes = await fetch(medicalUrl);
                const medicalData = await medicalRes.json();
                
                if (medicalData.error) {
                    statusDiv.innerHTML = `<span style='color: #ff5555;'>API Error: ${medicalData.error.error}</span>`;
                    return;
                }

                const snapshotBody = document.getElementById('snapshotBody');
                snapshotBody.innerHTML = "";
                
                if (medicalData.medical) {
                    const bloodBags = Object.values(medicalData.medical).filter(item => item.name.includes("Blood Bag"));
                    bloodBags.sort((a, b) => a.name.localeCompare(b.name));
                    
                    if (bloodBags.length > 0) {
                        bloodBags.forEach(item => {
                            snapshotData.push({ name: item.name, quantity: item.quantity });
                            snapshotBody.innerHTML += `
                                <tr>
                                    <td style="color: #fff;">${item.name}</td>
                                    <td style="color: #4CAF50; font-weight: bold;">${item.quantity.toLocaleString()}</td>
                                </tr>`;
                        });
                    } else {
                        snapshotBody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#888;">No blood bags found in armory.</td></tr>`;
                    }
                    document.getElementById('snapshotSection').style.display = "block";
                }

                // --- 2. FETCH ARMORY LOGS (3 Pages of 100 = 300 logs) ---
                let accumulatedLogs = [];
                let currentToTimestamp = Math.floor(Date.now() / 1000);
                
                // Loop 3 times to get 300 logs total
                for (let i = 0; i < 3; i++) {
                    const newsUrl = `https://api.torn.com/faction/?selections=armorynews&limit=100&to=${currentToTimestamp}&key=${apiKey}`;
                    const newsRes = await fetch(newsUrl);
                    const newsData = await newsRes.json();
                    
                    if (newsData.error) {
                        break; // Stop fetching if we hit an error midway
                    }
                    
                    if (newsData.armorynews) {
                        const logsArray = Object.values(newsData.armorynews);
                        if (logsArray.length === 0) break; // End of history reached
                        
                        accumulatedLogs.push(...logsArray);
                        
                        // Find the oldest log in this batch and set it as the starting point for the next loop
                        const oldestLog = logsArray.reduce((prev, curr) => (curr.timestamp < prev.timestamp ? curr : prev));
                        currentToTimestamp = oldestLog.timestamp - 1; 
                    } else {
                        break;
                    }
                }

                const logsBody = document.getElementById('logsBody');
                logsBody.innerHTML = "";
                document.getElementById('searchInput').value = ""; // Clear search bar

                if (accumulatedLogs.length > 0) {
                    // Sort them chronologically descending (newest at the top) just to be safe
                    accumulatedLogs.sort((a, b) => b.timestamp - a.timestamp);

                    // Options to force the timestamp into UTC (Torn City Time)
                    const tctOptions = { timeZone: 'UTC', year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };

                    accumulatedLogs.forEach(log => {
                        const dateObj = new Date(log.timestamp * 1000);
                        const tctDateStr = dateObj.toLocaleString('en-US', tctOptions) + ' TCT';
                        
                        const cleanText = log.news.replace(/<[^>]*>?/gm, ''); // Strip HTML for CSV
                        
                        allLogs.push({ date: tctDateStr, htmlText: log.news, cleanText: cleanText });

                        logsBody.innerHTML += `
                            <tr class="log-row">
                                <td style="color: #aaa;">${tctDateStr}</td>
                                <td>${log.news}</td>
                            </tr>`;
                    });
                    
                    statusDiv.innerHTML = `<span style='color: #4CAF50;'>Dashboard loaded! Found ${accumulatedLogs.length} recent armory logs.</span>`;
                } else {
                    logsBody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#888;">Armory log is currently empty.</td></tr>`;
                    statusDiv.innerHTML = `<span style='color: #4CAF50;'>Dashboard loaded, but no logs found.</span>`;
                }
                
                document.getElementById('logsSection').style.display = "block";

            } catch (error) {
                statusDiv.innerHTML = `<span style='color: #ff5555;'>Connection error: ${error.message}</span>`;
            }
        }

        function filterTable() {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const rows = document.querySelectorAll(".log-row");

            rows.forEach(row => {
                const logText = row.cells[1].innerText.toLowerCase();
                if (logText.includes(input)) {
                    row.style.display = "";
                } else {
                    row.style.display = "none";
                }
            });
        }

        function downloadSnapshotCSV() {
            if (snapshotData.length === 0) {
                alert("No snapshot data to download.");
                return;
            }

            const dateObj = new Date();
            const timestamp = dateObj.toISOString().split('T')[0] + "_" + dateObj.getHours() + dateObj.getMinutes();
            
            let csvContent = "data:text/csv;charset=utf-8,Item Name,Quantity\n";
            snapshotData.forEach(row => {
                csvContent += `"${row.name}","${row.quantity}"\n`;
            });

            triggerDownload(csvContent, `BloodBag_Snapshot_${timestamp}.csv`);
        }

        function downloadLogsCSV() {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const filteredLogs = allLogs.filter(log => log.cleanText.toLowerCase().includes(input));
            
            if (filteredLogs.length === 0) {
                alert("No logs match your current search.");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,Date (TCT),Log Entry\n";
            filteredLogs.forEach(row => {
                csvContent += `"${row.date}","${row.cleanText}"\n`;
            });

            triggerDownload(csvContent, "Filtered_Armory_Logs.csv");
        }

        function triggerDownload(csvContent, filename) {
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
