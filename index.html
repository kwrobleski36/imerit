<!DOCTYPE html>
<html>
<head>
    <title>Armory Snapshot: Blood Bags</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            background: #1e1e1e; 
            color: #ffffff; 
        }
        .container { 
            max-width: 800px; 
            margin: auto; 
            background: #2d2d2d; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        input, button { 
            padding: 10px; 
            margin: 10px 0; 
            width: 100%; 
            box-sizing: border-box; 
            border-radius: 4px;
            border: 1px solid #555;
        }
        input { background: #111; color: #fff; }
        .primary-btn { 
            background: #4CAF50; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            border: none;
        }
        .primary-btn:hover { background: #45a049; }
        
        .csv-btn {
            background: #2196F3;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
            display: none;
            margin-top: 0;
        }
        .csv-btn:hover { background: #1976D2; }

        .table-container { 
            margin-top: 20px; 
            background: #111; 
            border-radius: 5px; 
            max-height: 500px; 
            overflow-y: auto; 
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #333;
        }
        th {
            background-color: #222;
            position: sticky;
            top: 0;
            color: #4CAF50;
        }
        tr:nth-child(even) { background-color: #1a1a1a; }
        tr:hover { background-color: #2a2a2a; }
        
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Faction Armory Snapshot: Blood Bags</h2>
        
        <div id="loginScreen">
            <label>Enter your Torn API Key (Limited Access):</label>
            <input type="password" id="apiKeyInput" placeholder="Paste your API key here..." />
            <button class="primary-btn" onclick="fetchSnapshot()">Take Armory Snapshot</button>
        </div>

        <div class="controls">
            <div id="statusMessage"></div>
            <button id="csvButton" class="csv-btn" onclick="downloadCSV()">Download as CSV</button>
        </div>

        <div class="table-container">
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>Item Name</th>
                        <th>Quantity in Armory</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                    <!-- Data populates here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let globalSnapshotData = [];

        async function fetchSnapshot() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const statusDiv = document.getElementById('statusMessage');
            const resultsBody = document.getElementById('resultsBody');
            const csvBtn = document.getElementById('csvButton');
            
            if (!apiKey) {
                statusDiv.innerHTML = "<span style='color: #ff5555;'>Please enter an API key.</span>";
                return;
            }

            statusDiv.innerHTML = "Taking snapshot of medical armory...";
            csvBtn.style.display = "none";
            resultsBody.innerHTML = "";
            globalSnapshotData = [];

            // API v1: Hitting the medical selections of the faction armory
            const url = `https://api.torn.com/faction/?selections=medical&key=${apiKey}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.error) {
                    statusDiv.innerHTML = `<span style='color: #ff5555;'>API Error: ${data.error.error}</span>`;
                    return;
                }

                if (!data.medical) {
                    statusDiv.innerHTML = "<span style='color: #ff5555;'>No medical items found in armory.</span>";
                    return;
                }

                // Convert the medical object into an array and filter for Blood Bags
                const medicalArray = Object.values(data.medical);
                const bloodBags = medicalArray.filter(item => item.name.includes("Blood Bag"));

                if (bloodBags.length === 0) {
                    statusDiv.innerHTML = "No blood bags currently sitting in the armory.";
                    return;
                }

                statusDiv.innerHTML = `<span style='color: #4CAF50;'>Snapshot successful. Found ${bloodBags.length} unique blood bag types.</span>`;
                
                // Sort them so Empty Blood Bags appear at the top, followed by filled ones
                bloodBags.sort((a, b) => a.name.localeCompare(b.name));

                bloodBags.forEach(item => {
                    globalSnapshotData.push({ name: item.name, quantity: item.quantity });

                    resultsBody.innerHTML += `
                        <tr>
                            <td style="color: #fff;">${item.name}</td>
                            <td style="color: #4CAF50; font-weight: bold;">${item.quantity.toLocaleString()}</td>
                        </tr>`;
                });

                csvBtn.style.display = "block";

            } catch (error) {
                statusDiv.innerHTML = `<span style='color: #ff5555;'>Connection error: ${error.message}</span>`;
            }
        }

        function downloadCSV() {
            if (globalSnapshotData.length === 0) return;

            // Generate a timestamp for the filename so you know when the snapshot was taken
            const dateObj = new Date();
            const timestamp = dateObj.toISOString().split('T')[0] + "_" + dateObj.getHours() + dateObj.getMinutes();
            
            let csvContent = "data:text/csv;charset=utf-8,Item Name,Quantity\n";
            
            globalSnapshotData.forEach(row => {
                csvContent += `"${row.name}","${row.quantity}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Armory_Snapshot_${timestamp}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
